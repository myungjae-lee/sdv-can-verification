name: CAN Verification Tests

on:
  push:
    branches: [ main ]

jobs:
  lint-and-syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-can pytest

      - name: Check Python syntax
        run: python -m py_compile src/*.py tests/*.py

      - name: Collect tests (syntax/import check only, no execution)
        run: pytest tests/ --collect-only
